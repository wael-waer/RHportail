name: .NET CI Pipeline (Self-Hosted)

on:
  push:
    branches:
      - devops
  pull_request:
    branches:
      - devops
  workflow_dispatch:  

jobs:
  restore:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/PortailRH.sln

  build:
    runs-on: [self-hosted, Windows, X64]
    needs: restore
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies (again for this job)
        run: dotnet restore src/PortailRH.sln

      - name: Build
        run: dotnet build src/PortailRH.sln --configuration Release --no-restore

  test:
    runs-on: [self-hosted, Windows, X64]
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies (again for this job)
        run: dotnet restore src/PortailRH.sln

      - name: Build (again for this job)
        run: dotnet build src/PortailRH.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test src/PortailRH.sln --no-build --verbosity normal

  publish:
    runs-on: [self-hosted, Windows, X64]
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/PortailRH.sln

      - name: Build
        run: dotnet build src/PortailRH.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/PortailRH.sln -c Release -o ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-publish
          path: ./publish

  deploy:

   runs-on: [self-hosted, Windows, X64]
   needs: publish
   steps:
    - name: Download published artifact
      uses: actions/download-artifact@v4
      with:
        name: dotnet-publish
        path: ./publish

    - name: Deploy to local folder (PowerShell)
      shell: pwsh
      run: |
        $publishPath = Join-Path $PWD.Path 'publish'
        $target = 'C:\Apps\PortailRH'   

        Write-Host "Publish folder: $publishPath"
        Write-Host "Target folder:  $target"

        if (-not (Test-Path $publishPath)) {
          throw "Le dossier de publication est introuvable : $publishPath"
        }

        # Si le target existe et c'est un fichier, le supprimer
        if (Test-Path $target) {
          $item = Get-Item -LiteralPath $target
          if (-not $item.PSIsContainer) {
            Write-Host "La cible existe et c'est un fichier. Suppression du fichier..."
            Remove-Item -LiteralPath $target -Force
            New-Item -ItemType Directory -Path $target | Out-Null
          }
        } else {
          # créer le dossier cible s'il n'existe pas
          New-Item -ItemType Directory -Path $target | Out-Null
        }

        # Vider le dossier cible (sans supprimer le dossier lui-même)
        Get-ChildItem -LiteralPath $target -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

        # Copier tout le contenu du dossier publish vers la target
        Copy-Item -Path (Join-Path $publishPath '*') -Destination $target -Recurse -Force

        Write-Host "✅ Application déployée dans $target"

           