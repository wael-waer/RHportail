name: .NET CI Pipeline (Self-Hosted)

on:
  push:
    branches:
      - devops
  workflow_dispatch:  

jobs:
  build-and-test:
    runs-on: [self-hosted, Windows, X64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/PortailRH.sln

      - name: Build
        run: dotnet build src/PortailRH.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/PortailRH.sln --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/PortailRH.sln -c Release -o ./publish --no-build

      - name: Upload publish artifact
        uses: actions/upload-artifact@v3
        with:
          name: dotnet-publish
          path: ./publish